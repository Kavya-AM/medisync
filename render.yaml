# Render Blueprint: creates the API. The database lives on MongoDB Atlas (free tier).
services:
  - type: web
    name: medisync-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: MONGO_URI, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CLIENT_URL, sync: false }
      - { key: CLINIC_TZ, value: Asia/Kolkata }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: TWILIO_SID, sync: false }
      - { key: TWILIO_TOKEN, sync: false }
      - { key: TWILIO_FROM, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: FIREBASE_SERVICE_ACCOUNT, sync: false }
